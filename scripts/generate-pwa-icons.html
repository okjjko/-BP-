<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PWA 图标生成器</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      margin: 0;
    }
    canvas { display: none; }
    .preview {
      display: flex;
      gap: 32px;
      align-items: end;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .preview-item img {
      border-radius: 24px;
      border: 2px solid #334155;
    }
    .preview-item .size-label {
      font-size: 14px;
      color: #94a3b8;
    }
    button {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #16a34a; }
    h1 { font-size: 24px; margin: 0; }
    p { color: #64748b; margin: 0; }
    .status { color: #22c55e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>PWA 图标生成器</h1>
  <p>点击按钮生成 192x192 和 512x512 的 PNG 图标</p>

  <button onclick="generate()">生成并下载图标</button>
  <p id="status"></p>

  <div class="preview">
    <div class="preview-item">
      <img id="preview192" width="96" height="96">
      <span class="size-label">192x192</span>
    </div>
    <div class="preview-item">
      <img id="preview512" width="128" height="128">
      <span class="size-label">512x512</span>
    </div>
  </div>

  <!-- SVG 源（内联，不依赖外部文件） -->
  <svg id="icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" style="display:none">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#22c55e"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="96" fill="url(#bg)"/>
    <circle cx="400" cy="120" r="80" fill="#7c3aed" opacity="0.08"/>
    <circle cx="100" cy="420" r="100" fill="#22c55e" opacity="0.08"/>
    <rect x="96" y="140" width="320" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
    <text x="256" y="290" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="160" fill="#f8fafc" letter-spacing="-4">BP</text>
    <text x="256" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="42" fill="#94a3b8">植物大战僵尸</text>
    <rect x="96" y="380" width="320" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  </svg>

  <canvas id="canvas192" width="192" height="192"></canvas>
  <canvas id="canvas512" width="512" height="512"></canvas>

  <script>
    function renderToCanvas(canvas) {
      const ctx = canvas.getContext('2d');
      const svg = document.getElementById('icon-svg');
      const svgData = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      return new Promise((resolve) => {
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
      });
    }

    function download(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      a.click();
    }

    async function generate() {
      const status = document.getElementById('status');
      try {
        status.textContent = '生成中...';
        status.className = '';

        const [data192, data512] = await Promise.all([
          renderToCanvas(document.getElementById('canvas192')),
          renderToCanvas(document.getElementById('canvas512'))
        ]);

        // 预览
        document.getElementById('preview192').src = data192;
        document.getElementById('preview512').src = data512;

        // 下载
        download(data192, 'pwa-192.png');
        download(data512, 'pwa-512.png');

        status.textContent = '已生成并下载！请将两个 PNG 文件放入 public/ 目录';
        status.className = 'status';
      } catch (e) {
        status.textContent = '生成失败: ' + e.message;
        status.className = '';
        status.style.color = '#ef4444';
      }
    }
  </script>
</body>
</html>
