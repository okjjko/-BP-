<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="400" cy="120" r="80" fill="#7c3aed" opacity="0.08"/>
  <circle cx="100" cy="420" r="100" fill="#22c55e" opacity="0.08"/>

  <!-- 顶部渐变线 -->
  <rect x="96" y="140" width="320" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>

  <!-- 主标题 BP -->
  <text
    x="256" y="290"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="160"
    fill="#f8fafc"
    letter-spacing="-4"
  >BP</text>

  <!-- 底部副标题 -->
  <text
    x="256" y="355"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif"
    font-weight="500"
    font-size="42"
    fill="#94a3b8"
  >植物大战僵尸</text>

  <!-- 底部渐变线 -->
  <rect x="96" y="380" width="320" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
</svg>
